<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore 2026</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #1e1e2e;
            --darker: #181825;
            --light: #cdd6f4;
            --accent: #f38ba8;
            --success: #a6e3a1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--darker);
            color: var(--light);
            line-height: 1.6;
        }

        /* Header & Nav */
        header {
            background-color: var(--dark);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: var(--light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* Search Bar */
        .search-container {
            padding: 2rem;
            text-align: center;
            background: linear-gradient(to bottom, var(--dark), var(--darker));
        }

        #search-input {
            width: 100%;
            max-width: 600px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--secondary);
            background-color: var(--darker);
            color: var(--light);
            font-size: 1rem;
            outline: none;
        }

        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.3);
        }

        /* Games Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--dark);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #313244;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }

        .game-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #313244;
        }

        .game-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .category-badge {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            align-self: flex-start;
        }

        .game-card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--light);
        }

        .game-action {
            margin-top: auto;
        }

        .game-action button {
            width: 100%;
            padding: 10px;
            background-color: var(--secondary);
            border: none;
            color: var(--darker);
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .game-action button:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Sell Section */
        .sell-section {
            background-color: var(--dark);
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 2rem;
        }

        .sell-section h2 {
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .sell-form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sell-form input, 
        .sell-form select, 
        .sell-form textarea {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--secondary);
            background-color: var(--darker);
            color: var(--light);
        }

        .sell-form button {
            padding: 12px;
            background-color: var(--success);
            border: none;
            color: var(--darker);
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--dark);
            padding: 2rem;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            position: relative;
            border: 2px solid var(--primary);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: var(--light);
        }

        .payment-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .payment-form input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--secondary);
            background-color: var(--darker);
            color: var(--light);
        }

        .payment-form button {
            padding: 12px;
            background-color: var(--primary);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--dark);
            color: #6c7086;
            font-size: 0.9rem;
        }
    </style>
</head>

    </header>

    <!-- Search -->

    <main class="container" id="games">

    <!-- Sell Section -->
    <section class="sell-section" id="sell">
        <h2>Sell Your Account</h2>
        <p>Found a rare account? Sell it to us!</p>
        <form id="sell-form" class="sell-form">
            <input type="text" id="account-name" placeholder="Account Name / ID" required>
            <select id="game-type" required>
                <option value="">Select Game Type</option>
                <option value="mmo">MMO</option>
                <option value="fps">FPS</option>
                <option value="rpg">RPG</option>
                <option value="other">Other</option>
            </select>
            <input type="number" id="account-level" placeholder="Account Level" required>
            <textarea rows="3" placeholder="Additional Details (Items, Skins, etc.)"></textarea>
            <button type="submit">Submit Offer</button>
        </form>
    </section>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-game-title">Game Title</h2>
            <p style="margin-top: 10px;">Price: <span id="modal-price" style="color: var(--success); font-weight: bold;">$0.00</span></p>
            <form class="payment-form">
                <input type="text" placeholder="Card Number" required>
                <input type="text" placeholder="MM/YY" required>
                <input type="text" placeholder="CVC" required>
                <button type="submit">Pay Now</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 GameStore. All rights reserved.
    </footer>

            { name: "Chip", category: "Currency", image: "https://cdn.gameboost.com/games/chip/banner/default.webp" }
        ];

        // --- LOGIC ---
        
        // Render Games Function
        function renderGames(gamesToRender) {
            const container = document.getElementById('games-grid');
            container.innerHTML = ''; // Clear existing content
            
            gamesToRender.forEach(game => {
                if (!game.name) return; // Skip empty entries
                
                const card = document.createElement('div');
                card.className = 'game-card';
                
                // Create image element
                const img = document.createElement('img');
                img.src = game.image || 'https://via.placeholder.com/300x200?text=No+Image';
                img.alt = game.name;
                img.loading = 'lazy';
                
                // Create title
                const title = document.createElement('h3');
                title.textContent = game.name;
                
                // Create category badge
                const badge = document.createElement('span');
                badge.className = 'category-badge';
                badge.textContent = game.category;
                
                // Create price/button area
                const action = document.createElement('div');
                action.className = 'game-action';
                
                const btn = document.createElement('button');
                btn.textContent = 'View Details';
                btn.onclick = () => openPaymentModal(game);
                
                action.appendChild(btn);
                
                card.appendChild(img);
                card.appendChild(badge);
                card.appendChild(title);
                card.appendChild(action);
                
                container.appendChild(card);
            });
        }

        // Initial Render
        document.addEventListener('DOMContentLoaded', () => {
            renderGames(games);
            
            // Search functionality
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    const filtered = games.filter(game => 
                        game.name.toLowerCase().includes(query) || 
                        game.category.toLowerCase().includes(query)
                    );
                    renderGames(filtered);
                });
            }
        });

        // Payment Modal Logic
        function openPaymentModal(game) {
            const modal = document.getElementById('payment-modal');
            const modalTitle = document.getElementById('modal-game-title');
            const modalPrice = document.getElementById('modal-price');
            
            if (modal && modalTitle && modalPrice) {
                modalTitle.textContent = game.name;
                modalPrice.textContent = `$${(Math.random() * 50 + 10).toFixed(2)}`; // Random price for demo
                modal.style.display = 'flex';
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('payment-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // Close modal with X button
        const closeBtn = document.querySelector('.close-btn');
        if (closeBtn) {
            closeBtn.addEventListener('click', () => {
                document.getElementById('payment-modal').style.display = 'none';
            });
        }

        // Sell Your Account Section Logic
        const sellForm = document.getElementById('sell-form');
        if (sellForm) {
            sellForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const accountName = document.getElementById('account-name').value;
                const gameType = document.getElementById('game-type').value;
                const level = document.getElementById('account-level').value;
                
                alert(`Thank you! We have received your offer for ${accountName} (${gameType}, Level ${level}). We will contact you shortly.`);
                sellForm.reset();
            });
        }
    </script>
</body>
</html>
